<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 2 - d3</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>

    <svg width="800" height="400"></svg>
    <script>
        // load in svg file
        d3.csv("../data/penglings.csv", d3.autoType).then(data => {
            const svg = d3.select("svg");
        
            //chart size 
            const margin = {top: 20, right: 30, bottom: 40, left: 50};
            const width = 600 - margin.left - margin.right;
            const height = 400 - margin.top - margin.bottom;

            const g = svg.append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // setting x axis
            const x = d3.scaleLinear()
                .domain(d3.extent(data, d => d.flipper_length_mm))
                .range([0, width]);

                g.append("g")
                    .attr("transform", `translate(0,${height})`)
                    .call(d3.axisBottom(x));

                g.append("text")
                    .attr("x", width / 2)
                    .attr("y", height + margin.bottom - 5)
                    .attr("text-anchor", "middle")
                    .attr("font-family", "sans-serif")
                    .attr("font-size", 12)
                    .text("Flipper length (mm)");

            // setting y axis
            const y = d3.scaleLinear()
                .domain(d3.extent(data, d => d.body_mass_g))
                .range([height, 0]);

                g.append("g")
                    .call(d3.axisLeft(y));

                g.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("x", -height / 2)
                    .attr("y", -margin.left + 15)
                    .attr("text-anchor", "middle")
                    .attr("font-family", "sans-serif")
                    .attr("font-size", 12)
                    .text("Body mass (g)");

            // setting color
            const color = d3.scaleOrdinal(d3.schemeCategory10);

            //plotting the points
            const size = d3.scaleLinear()
                .domain(d3.extent(data, d => d.bill_length_mm))
                .range([5, 10]);

            g.selectAll("circle")
                .data(data)
                .enter()
                .append("circle")
                .attr("cx", d => x(d.flipper_length_mm))
                .attr("cy", d => y(d.body_mass_g))
                .attr("r", d => size(d.bill_length_mm))
                .attr("fill", d => color(d.species))
                .attr("opacity", 0.7);

            // part for a key/legend
            const key = svg.append("g")
                .attr("transform", `translate(${margin.left + width + 10},${margin.top})`);

            const keyitem = color.domain();

            keyitem.forEach((species, i) => {
                const row = key.append("g")
                    .attr("transform", `translate(0,${i * 20})`);

                row.append("rect")
                    .attr("width", 12)
                    .attr("height", 12)
                    .attr("fill", color(species));

                row.append("text")
                    .attr("x", 18)
                    .attr("y", 10)
                    .attr("font-family", "sans-serif")
                    .attr("font-size", 12)
                    .text(species);
            });
        });
    </script>

</body>
</html>
