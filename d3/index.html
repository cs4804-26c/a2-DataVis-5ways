<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Penguins d3</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    svg {
      width: 100vw;
      height: 100vh;
    }

    .tooltip {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 12px;
      pointer-events: none;
      border-radius: 4px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>
  <svg viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="tooltip" style="opacity:0;"></div>

  <script src="script.js"></script>
</body>
</html>
