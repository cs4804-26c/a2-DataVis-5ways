<!DOCTYPE html>
<head>
    <title>D3 Example</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
    <div id="container"></div>
    <div id="info_panel"></div>

    <script type="module">
        const HEIGHT = 600;
        const WIDTH = 900;

        const X_MARGIN = 80;
        const Y_MARGIN = 50;

        // Load in data
        let csvData = await fetch("../penglings.csv")
            .then(res => res.text())
            .then(csvString => {return csvString})
        
        let data = d3.csvParse(csvData);

        for (let i = 0; i < data.length; i++) {
            data[i].flipper_length_mm = parseFloat(data[i].flipper_length_mm);
            data[i].bill_length_mm = parseFloat(data[i].bill_length_mm);
            data[i].body_mass_g = parseFloat(data[i].body_mass_g);
        }

        // Flipper values
        const flipperExtent = d3.extent(data, d => d.flipper_length_mm);

        const x = d3.scaleLinear()
            .domain(flipperExtent)
            .range([X_MARGIN, WIDTH - X_MARGIN]);

        const xAxis = d3.axisBottom(x);

        // Body mass values
        const massExtent = d3.extent(data, d => d.body_mass_g);

        const y = d3.scaleLinear()
            .domain(massExtent)
            .range([HEIGHT - Y_MARGIN, Y_MARGIN]);
        
        const yAxis = d3.axisLeft(y);

        // Bill Length scale
        const billScale = d3.scaleLinear()
            .domain(d3.extent(data, d => d.bill_length_mm))
            .range([6, 12])


        // Attach axes
        const svg = d3.create("svg")
            .attr("width", WIDTH)
            .attr("height", HEIGHT)
        
        svg.append("g")
            .attr("transform", `translate(0, ${HEIGHT - Y_MARGIN})`)
            .call(xAxis)

        svg.append("g")
            .attr("transform", `translate(${X_MARGIN}, 0)`)
            .call(yAxis)


        // Graph points
        svg.append("g")
            .attr("stroke-width", 1.5)
            .selectAll("circle")
            .data(data)
            .join("circle")
                .attr("r", d => billScale(d.bill_length_mm))
                .attr("fill", d => {
                    if (d.species === "Adelie") return "darkorange";
                    if (d.species === "Chinstrap") return "magenta";
                    if (d.species === "Gentoo") return "teal";
                })
                .attr("stroke", d => {
                    if (d.species === "Adelie") return "darkorange";
                    if (d.species === "Chinstrap") return "magenta";
                    if (d.species === "Gentoo") return "teal";
                })
                .attr("fill-opacity", 0.8)
                .attr("cx", d => x(d.flipper_length_mm))
                .attr("cy", d => y(d.body_mass_g))
                .on("mouseover", (event, d) => {
                    document.getElementById("info_panel").innerText = 
                    `Species: ${d.species}
                    Flipper Length (mm): ${d.flipper_length_mm}
                    Bill Length (mm): ${d.bill_length_mm}
                    Body Mass (g): ${d.body_mass_g}`
                })


        // Attach axes labels
        svg.append("text")
            .text("Flipper Length (mm)")
            .attr("x", WIDTH/2 - X_MARGIN)
            .attr("y", HEIGHT - Y_MARGIN + 40)

        svg.append("text")
            .text("Body Mass (g)")
            .attr("transform", `rotate(270, 25, ${HEIGHT/2 + Y_MARGIN})`)
            .attr("x", 25)
            .attr("y", HEIGHT/2 + Y_MARGIN)

        // Attach SVG
        container.append(svg.node());
    </script>
</body>
