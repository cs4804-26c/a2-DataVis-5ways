<!DOCTYPE html>
<html>
<head>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; }
        .dot { stroke: #000; stroke-width: 0.5px; }
        .axis-label { font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="viz"></div>
    <script>
        const margin = {top: 40, right: 30, bottom: 60, left: 70},
              width = 800 - margin.left - margin.right,
              height = 500 - margin.top - margin.bottom;

        const svg = d3.select("#viz")
            .append("svg")
              .attr("width", width + margin.left + margin.right)
              .attr("height", height + margin.top + margin.bottom)
            .append("g")
              .attr("transform", `translate(${margin.left},${margin.top})`);

        // Calling csv
        d3.csv("../penglings.csv").then(data => {
            
            // Cleaning data
            data.forEach(d => {
                d.flipper = +d.flipper_length_mm;
                d.mass = +d.body_mass_g;
                d.bill = +d.bill_length_mm;
            });

            const x = d3.scaleLinear().domain([170, 235]).range([0, width]);
            const y = d3.scaleLinear().domain([2500, 6500]).range([height, 0]);
            const color = d3.scaleOrdinal()
                .domain(["Adelie", "Chinstrap", "Gentoo"])
                .range(["#ff8c00", "#9932cc", "#008b8b"]);

            // Add Axes
            svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x));
            svg.append("g").call(d3.axisLeft(y));

            // Add Labels
            svg.append("text").attr("class", "axis-label").attr("x", width/2).attr("y", height + 40).text("Flipper Length (mm)");
            svg.append("text").attr("class", "axis-label").attr("transform", "rotate(-90)").attr("x", -height/2).attr("y", -50).text("Body Mass (g)");

            // Draw Circles
            svg.selectAll(".dot")
                .data(data)
                .enter().append("circle")
                .attr("class", "dot")
                .attr("cx", d => x(d.flipper))
                .attr("cy", d => y(d.mass))
                .attr("r", d => d.bill / 5) 
                .style("fill", d => color(d.species))
                .style("opacity", 0.8);
        }).catch(err => {
            console.error("Error loading the CSV file. Check the path!", err);
        });
    </script>
</body>
</html>
