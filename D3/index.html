<!DOCTYPE html>
<meta charset="utf-8">

<script src="https://d3js.org/d3.v4.js"></script>

<h1> Flipper Length VS Body Mass</h1>

<div id="cooldatadivthing"></div>
<p id="stats"></p>

<script>
  var margin = {top: 10, right: 30, bottom: 50, left: 60},
      width  = 460 - margin.left - margin.right,
      height = 400 - margin.top - margin.bottom;

  var svg = d3.select("#cooldatadivthing")
    .append("svg")
      .attr("width",  width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
    .append("g")
      .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

  d3.csv("penglings.csv", function(data) {

    data.forEach(function(d)
    {
      d.flipper = +d.flipper_length_mm;
      d.mass    = +d.body_mass_g;
      d.bill    = +d.bill_length_mm;
      d.species = d.species;
    });

    data = data.filter(function(d)
    {
      return isFinite(d.flipper) && isFinite(d.mass) && isFinite(d.bill) && d.species;
    });

    var x = d3.scaleLinear()
      .domain(d3.extent(data, function(d) { return d.flipper; }))
      .range([0, width])
      .nice();

    svg.append("g")
      .attr("transform", "translate(0," + height + ")")
      .call(d3.axisBottom(x).tickValues(d3.range(170, 241, 10)));

    var y = d3.scaleLinear()
      .domain(d3.extent(data, function(d) { return d.mass; }))
      .range([height, 0])
      .nice();

    svg.append("g")
      .call(d3.axisLeft(y).ticks(6));

    svg.append("text")
      .attr("x", width / 2)
      .attr("y", height + 40)
      .attr("text-anchor", "middle")
      .text("Flipper Length (mm)");

    svg.append("text")
      .attr("transform", "rotate(-90)")
      .attr("x", -height / 2)
      .attr("y", -45)
      .attr("text-anchor", "middle")
      .text("Body Mass (g)");

    var color = d3.scaleOrdinal()
      .domain(["Adelie", "Chinstrap", "Gentoo"])
      .range(["#FF0000", "#00FF00", "#0000FF"]);

    var r = d3.scaleSqrt()
      .domain(d3.extent(data, function(d){ return d.bill; }))
      .range([2.5, 9]);

    svg.append("g")
      .selectAll("dot")
      .data(data)
      .enter()
      .append("circle")
        .attr("cx", function(d) { return x(d.flipper); })
        .attr("cy", function(d) { return y(d.mass); })
        .attr("r",  function(d) { return r(d.bill); })
        .style("fill", function(d) { return color(d.species); })
        .style("opacity", 0.8);

    var flipperExtent = d3.extent(data, function(d) { return d.flipper; });
    d3.select("#stats").text("Flipper Min: " + flipperExtent[0] + ", Flipper Max: " + flipperExtent[1])

  });
</script>
