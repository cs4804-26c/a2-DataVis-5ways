<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Penguin Scatterplot</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    const spec = {
      "width": 700,
      "height": 500,
      "data": { "url": "penglings.csv" },
      "transform": [
        {"filter": "isValid(datum.flipper_length_mm) && isValid(datum.body_mass_g) && isValid(datum.bill_length_mm)"}
      ],
      "mark": { "type": "circle", "opacity": 0.8 },
      "encoding": {
        "x": {
          "field": "flipper_length_mm", "type": "quantitative",
          "title": "Flipper Length (mm)", "scale": {"domain": [170, 235]}
        },
        "y": {
          "field": "body_mass_g", "type": "quantitative",
          "title": "Body Mass (g)", "scale": {"domain": [2500, 6500]}
        },
        "color": { "field": "species", "type": "nominal" },
        "size": { "field": "bill_length_mm", "type": "quantitative" },
        "tooltip": [
          {"field": "species"},
          {"field": "flipper_length_mm"},
          {"field": "body_mass_g"},
          {"field": "bill_length_mm"}
        ]
      }
    };

    vegaEmbed("#vis", spec);
  </script>
</body>
</html>
